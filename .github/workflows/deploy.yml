name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
  # Public URL of the site. It also sets the path the build is served under.
  # Stays on the GitHub Pages project URL until the saintdominic.org cutover:
  # then set the repository variable VITE_SITE_URL=https://saintdominic.org
  # and re-run this workflow (docs/domain-transfer.md).
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://frassatidavis.github.io/st-dom-yt-website' }}
  # Diocesan's bulletin-widget key for the parish (adds the PDF link and past
  # issues to /bulletin). Without it the page still shows the weekly cover.
  VITE_DISCOVERMASS_KEY: ${{ vars.VITE_DISCOVERMASS_KEY }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Audit production dependencies only — dev-only tooling vulns (vitest/vite/esbuild)
      # don't ship to the site and shouldn't block deploys. Real shipped vulns still gate.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run test:run
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
