name: Build Check

on:
  pull_request:
    branches: [main]

env:
  VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Audit production dependencies only — dev-only tooling vulns (vitest/vite/esbuild)
      # don't ship to the site and shouldn't block deploys. Real shipped vulns still gate.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run test:run
      - run: npm run build
